syntax = "proto3";

package zaicontracts.sleep;
import "Protos/sleep_service_messages.proto";

// Sleep Analysis Service
service SleepService {
  // Analyze sleep data with streaming response
  rpc AnalyzeSleep (SleepDataRequest) returns (stream SleepChatResponse);

  // Chat with sleep assistant with streaming response
  rpc Chat (SleepChatRequest) returns (stream SleepChatResponse);

  // Home / Today screen
  rpc GetToday (GetTodayRequest)
      returns (GetTodayResponse);

  // Save sleep day data from HealthKit/UserInput
  rpc SaveSleepDay (SaveSleepDayRequest)
      returns (SaveSleepDayResponse);

  // Bulk-ingest sleep history (e.g. on first HealthKit connect). Saves all nights,
  // recomputes baseline once at the end, scores every night against the final baseline,
  // and skips per-night AI generation. AI insights come from GetWindowInsights afterward.
  rpc IngestSleepHistory (IngestSleepHistoryRequest)
      returns (IngestSleepHistoryResponse);

  // Save user baseline
  rpc SaveBaseline (SaveBaselineRequest)
      returns (SaveBaselineResponse);

  // Save user sleep context (stress, caffeine, etc.)
  rpc SaveSleepContext (SubmitSleepContextRequest)
      returns (SubmitSleepContextResponse);

  // Home screen - single scroll view with all data
  rpc GetHomeScreen (GetHomeScreenRequest)
      returns (GetHomeScreenResponse);

  // Weekly report - single report detail
  rpc GetWeeklyReport (GetWeeklyReportRequest)
      returns (GetWeeklyReportResponse);

  // Weekly report - list of report summaries
  rpc GetWeeklyReportsList (GetWeeklyReportsListRequest)
      returns (GetWeeklyReportsListResponse);

  // Daily report - single report detail
  rpc GetDailyReport (GetDailyReportRequest)
      returns (GetDailyReportResponse);

  // Daily report - list of report summaries
  rpc GetDailyReportsList (GetDailyReportsListRequest)
      returns (GetDailyReportsListResponse);

  // Window insights - AI-generated analysis for an arbitrary date range (e.g. last 7/14/30 days).
  // Generated on-demand. Frontend is expected to cache.
  rpc GetWindowInsights (GetWindowInsightsRequest)
      returns (GetWindowInsightsResponse);
}
