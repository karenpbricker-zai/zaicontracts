syntax = "proto3";

package zaicontracts.experiment;
import "Protos/sleep_service_messages.proto";

// Experiment Service - manages sleep improvement experiments
service ExperimentService {
  // Get a recommended experiment based on user's sleep data
  rpc GetRecommendedExperiment (zaicontracts.sleep.GetRecommendedExperimentRequest)
      returns (zaicontracts.sleep.GetRecommendedExperimentResponse);

  // Start a new experiment
  rpc StartExperiment (zaicontracts.sleep.StartExperimentRequest)
      returns (zaicontracts.sleep.ExperimentStatus);

  // Get the user's currently active experiment
  rpc GetActiveExperiment (zaicontracts.sleep.GetActiveExperimentRequest)
      returns (zaicontracts.sleep.ExperimentStatus);

  // Complete an experiment and get results
  rpc CompleteExperiment (zaicontracts.sleep.CompleteExperimentRequest)
      returns (zaicontracts.sleep.ExperimentResult);

  // Submit sleep context (stress, caffeine, etc.) for a night
  rpc SubmitSleepContext (zaicontracts.sleep.SubmitSleepContextRequest)
      returns (zaicontracts.sleep.SubmitSleepContextResponse);

  // Get the user's experiment history (completed experiments)
  rpc GetExperimentHistory (zaicontracts.sleep.GetExperimentHistoryRequest)
      returns (zaicontracts.sleep.GetExperimentHistoryResponse);
}
