syntax = "proto3";

package zaicontracts.auth;

option java_multiple_files = true;
option java_package = "zaicontracts.auth";

import "Protos/sleep_service_enums.proto";

// Authentication Service
service AuthService {
  // Create anonymous user (no login required)
  rpc CreateAnonymousUser(CreateAnonymousUserRequest) returns (CreateAnonymousUserResponse);

  // Link anonymous account to Apple ID (for multi-device sync)
  rpc LinkAppleAccount(LinkAppleAccountRequest) returns (LinkAppleAccountResponse);

  // Sign in with Apple (create or login)
  rpc SignInWithApple(SignInWithAppleRequest) returns (SignInWithAppleResponse);

  // Link anonymous account to Google ID (for multi-device sync)
  rpc LinkGoogleAccount(LinkGoogleAccountRequest) returns (LinkGoogleAccountResponse);

  // Sign in with Google (create or login)
  rpc SignInWithGoogle(SignInWithGoogleRequest) returns (SignInWithGoogleResponse);

  // Exchange a valid (unexpired) JWT for a fresh one. Call when the current
  // token is older than ~half its lifetime. Requires authentication.
  rpc RefreshAccessToken(RefreshAccessTokenRequest) returns (RefreshAccessTokenResponse);

  // Save user profile (one user = one profile, upsert)
  rpc SaveUserProfile(SaveUserProfileRequest) returns (SaveUserProfileResponse);

  // Get the authenticated user's saved profile plus account email
  rpc GetUserProfile(GetUserProfileRequest) returns (GetUserProfileResponse);

  // Register device token for push notifications
  rpc RegisterDeviceToken(RegisterDeviceTokenRequest) returns (RegisterDeviceTokenResponse);

  // Unregister device token (e.g. on sign out)
  rpc UnregisterDeviceToken(UnregisterDeviceTokenRequest) returns (UnregisterDeviceTokenResponse);

  // Update user email
  rpc UpdateUserEmail(UpdateUserEmailRequest) returns (UpdateUserEmailResponse);

  // Get user by ID
  rpc GetUser(GetUserRequest) returns (GetUserResponse);

  // Delete account and all associated data
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
}

// ==================
// Anonymous User Creation
// ==================

message CreateAnonymousUserRequest {
  string device_id = 1;  // iOS identifierForVendor
}

message CreateAnonymousUserResponse {
  string user_id = 1;
  string access_token = 2;  // Legacy: equals user_id. Will be removed after JWT migration.
  bool is_premium = 3;
  string jwt_access_token = 4;  // Signed JWT. Send as "authorization: Bearer <jwt>" on every call.
}

// ==================
// Link Apple Account
// ==================

message LinkAppleAccountRequest {
  string anonymous_user_id = 1;
  string apple_user_id = 2;
  string email = 3;
  string full_name = 4;
  string identity_token = 5;  // Apple identityToken (JWT) from ASAuthorization. Verified server-side; sub must equal apple_user_id.
}

message LinkAppleAccountResponse {
  string user_id = 1;
  bool success = 2;
  string message = 3;
  string jwt_access_token = 4;  // Signed JWT for the (possibly migrated) user.
}

// ==================
// Apple Sign In
// ==================

message SignInWithAppleRequest {
  string apple_user_id = 1;
  string email = 2;
  string full_name = 3;
  string device_id = 4;  // Optional. Stored on the user record (new user) or updated (existing apple user on a new device). Empty string = not provided.
  string identity_token = 5;  // Apple identityToken (JWT) from ASAuthorization. Verified server-side; sub must equal apple_user_id.
}

message SignInWithAppleResponse {
  string user_id = 1;
  string access_token = 2;  // Legacy: equals user_id. Will be removed after JWT migration.
  bool is_new_user = 3;
  string jwt_access_token = 4;  // Signed JWT. Send as "authorization: Bearer <jwt>" on every call.
}

// ==================
// Link Google Account
// ==================

message LinkGoogleAccountRequest {
  string anonymous_user_id = 1;
  string google_user_id = 2;  // Google account ID ("sub" claim from the Google ID token)
  string email = 3;
  string full_name = 4;
  string identity_token = 5;  // Google ID token (JWT) from the Sign-In SDK. Verified server-side; sub must equal google_user_id.
}

message LinkGoogleAccountResponse {
  string user_id = 1;
  bool success = 2;
  string message = 3;
  string jwt_access_token = 4;  // Signed JWT for the (possibly migrated) user.
}

// ==================
// Google Sign In
// ==================

message SignInWithGoogleRequest {
  string google_user_id = 1;  // Google account ID ("sub" claim from the Google ID token)
  string email = 2;
  string full_name = 3;
  string device_id = 4;  // Optional. Stored on the user record (new user) or updated (existing google user on a new device). Empty string = not provided.
  string identity_token = 5;  // Google ID token (JWT) from the Sign-In SDK. Verified server-side; sub must equal google_user_id.
}

message SignInWithGoogleResponse {
  string user_id = 1;
  string access_token = 2;  // Legacy: equals user_id. Will be removed after JWT migration.
  bool is_new_user = 3;
  string jwt_access_token = 4;  // Signed JWT. Send as "authorization: Bearer <jwt>" on every call.
}

// ==================
// Token Refresh
// ==================

message RefreshAccessTokenRequest {
  // Empty: identity comes from the authorization header (current JWT must still be valid).
}

message RefreshAccessTokenResponse {
  string jwt_access_token = 1;  // Fresh JWT replacing the one used to authenticate this call.
}

// ==================
// User Profile
// ==================

message SaveUserProfileRequest {
  zaicontracts.sleep.ProfileSleepGoal sleep_goal = 1;
  double sleep_time = 2;
  int32 sleep_quality = 3;
  zaicontracts.sleep.ProfileSleepTime get_on_bed_time = 4;
  zaicontracts.sleep.ProfileWakeTime get_up_time = 5;
  int32 motivation = 6;
  string time_zone_id = 7; // IANA timezone id, e.g. "America/Los_Angeles" (optional; empty = unknown)
}

message SaveUserProfileResponse {
  bool success = 1;
  string message = 2;
}

message GetUserProfileRequest {
  // Empty: identity comes from the authorization header.
}

message GetUserProfileResponse {
  bool has_profile = 1;  // false when the user has not saved a profile yet (fields 2-8 hold proto defaults)
  zaicontracts.sleep.ProfileSleepGoal sleep_goal = 2;
  double sleep_time = 3;
  int32 sleep_quality = 4;
  zaicontracts.sleep.ProfileSleepTime get_on_bed_time = 5;
  zaicontracts.sleep.ProfileWakeTime get_up_time = 6;
  int32 motivation = 7;
  string time_zone_id = 8;   // IANA timezone id, e.g. "America/Los_Angeles" (empty = unknown)
  optional string email = 9; // account email; unset when the account has none (e.g. anonymous user)
}

// ==================
// Device Token (Push Notifications)
// ==================

message RegisterDeviceTokenRequest {
  string token = 1;        // APNS device token (iOS, hex string) or FCM registration token (Android)
  string platform = 2;     // "ios" | "android" (defaults to "ios" when empty)
}

message RegisterDeviceTokenResponse {
  bool success = 1;
}

message UnregisterDeviceTokenRequest {
  string token = 1;
}

message UnregisterDeviceTokenResponse {
  bool success = 1;
}

// ==================
// Update User Email
// ==================

message UpdateUserEmailRequest {
  string email = 1;
}

message UpdateUserEmailResponse {
  bool success = 1;
  string message = 2;
}

// ==================
// Get User
// ==================

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  string user_id = 1;
  optional string email = 2;
  optional string device_id = 3;
  optional string apple_user_id = 4;
  bool is_anonymous = 5;
  bool is_premium = 6;
  string created_at = 7;
  string updated_at = 8;
  optional string google_user_id = 9;
}

// ==================
// Delete Account
// ==================

message DeleteAccountRequest {
  string user_id = 1;
}

message DeleteAccountResponse {
  bool success = 1;
  string message = 2;
}
