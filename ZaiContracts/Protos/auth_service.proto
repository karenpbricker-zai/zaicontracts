syntax = "proto3";

package zaicontracts.auth;

import "Protos/sleep_service_enums.proto";

// Authentication Service
service AuthService {
  // Create anonymous user (no login required)
  rpc CreateAnonymousUser(CreateAnonymousUserRequest) returns (CreateAnonymousUserResponse);

  // Link anonymous account to Apple ID (for multi-device sync)
  rpc LinkAppleAccount(LinkAppleAccountRequest) returns (LinkAppleAccountResponse);

  // Sign in with Apple (create or login)
  rpc SignInWithApple(SignInWithAppleRequest) returns (SignInWithAppleResponse);

  // Save user profile (one user = one profile, upsert)
  rpc SaveUserProfile(SaveUserProfileRequest) returns (SaveUserProfileResponse);

  // Register device token for push notifications
  rpc RegisterDeviceToken(RegisterDeviceTokenRequest) returns (RegisterDeviceTokenResponse);

  // Unregister device token (e.g. on sign out)
  rpc UnregisterDeviceToken(UnregisterDeviceTokenRequest) returns (UnregisterDeviceTokenResponse);

  // Update user email
  rpc UpdateUserEmail(UpdateUserEmailRequest) returns (UpdateUserEmailResponse);

  // Get user by ID
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
}

// ==================
// Anonymous User Creation
// ==================

message CreateAnonymousUserRequest {
  string device_id = 1;  // iOS identifierForVendor
}

message CreateAnonymousUserResponse {
  string user_id = 1;
  string access_token = 2;  // Currently just returns user_id, later will be JWT
  bool is_premium = 3;
}

// ==================
// Link Apple Account
// ==================

message LinkAppleAccountRequest {
  string anonymous_user_id = 1;
  string apple_user_id = 2;
  string email = 3;
  string full_name = 4;
}

message LinkAppleAccountResponse {
  string user_id = 1;
  bool success = 2;
  string message = 3;
}

// ==================
// Apple Sign In
// ==================

message SignInWithAppleRequest {
  string apple_user_id = 1;
  string email = 2;
  string full_name = 3;
  string device_id = 4;  // Optional. Stored on the user record (new user) or updated (existing apple user on a new device). Empty string = not provided.
}

message SignInWithAppleResponse {
  string user_id = 1;
  string access_token = 2;
  bool is_new_user = 3;
}

// ==================
// User Profile
// ==================

message SaveUserProfileRequest {
  zaicontracts.sleep.ProfileSleepGoal sleep_goal = 1;
  double sleep_time = 2;
  int32 sleep_quality = 3;
  zaicontracts.sleep.ProfileSleepTime get_on_bed_time = 4;
  zaicontracts.sleep.ProfileWakeTime get_up_time = 5;
  int32 motivation = 6;
}

message SaveUserProfileResponse {
  bool success = 1;
  string message = 2;
}

// ==================
// Device Token (Push Notifications)
// ==================

message RegisterDeviceTokenRequest {
  string token = 1;        // APNS device token (hex string)
  string platform = 2;     // "ios" (future: "android")
}

message RegisterDeviceTokenResponse {
  bool success = 1;
}

message UnregisterDeviceTokenRequest {
  string token = 1;
}

message UnregisterDeviceTokenResponse {
  bool success = 1;
}

// ==================
// Update User Email
// ==================

message UpdateUserEmailRequest {
  string email = 1;
}

message UpdateUserEmailResponse {
  bool success = 1;
  string message = 2;
}

// ==================
// Get User
// ==================

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  string user_id = 1;
  optional string email = 2;
  optional string device_id = 3;
  optional string apple_user_id = 4;
  bool is_anonymous = 5;
  bool is_premium = 6;
  string created_at = 7;
  string updated_at = 8;
}
